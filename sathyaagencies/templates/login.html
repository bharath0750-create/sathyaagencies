{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}<section class="auth-shell"><div class="auth-card"><span class="kicker">CUSTOMER PORTAL</span><h1>Welcome back</h1><p class="muted">Sign in to book and track your gas cylinders.</p>
<form method="POST" action="{{ url_for('login') }}" class="form-stack">
<label>Email address<input type="email" name="email" placeholder="you@example.com" required autocomplete="email"></label>
<label>Password<input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password"></label>
<button class="btn btn-primary full" type="submit">Sign in →</button></form>
<p class="form-foot">New customer? <a href="{{ url_for('register') }}">Create an account</a></p><p class="form-foot"><a href="{{ url_for('admin_login') }}">Administrator login</a></p></div></section>{% endblock %}
