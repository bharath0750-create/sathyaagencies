{% extends "base.html" %}{% block title %}My Profile{% endblock %}{% block content %}<section class="page-hero compact"><div class="container"><span class="kicker">ACCOUNT</span><h1>My profile</h1><p>Keep your customer and delivery details up to date.</p></div></section><section class="section"><div class="container narrow"><form method="POST" class="panel form-stack"><div class="form-two"><label>Name<input name="name" value="{{ user[1] }}" required></label><label>Phone<input name="phone" value="{{ user[3] }}" required></label></div><label>Email<input value="{{ user[2] }}" disabled></label><label>Address<textarea name="address" rows="3">{{ user[4] or '' }}</textarea></label><div class="form-two"><label>City<input name="city" value="{{ user[5] or '' }}"></label><label>Pincode<input name="pincode" value="{{ user[6] or '' }}"></label></div><button class="btn btn-primary" type="submit">Save changes</button></form></div></section>{% endblock %}
