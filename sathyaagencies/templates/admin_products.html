{% extends "base.html" %}{% block title %}Manage Inventory{% endblock %}{% block content %}<section class="page-hero compact"><div class="container"><span class="kicker">ADMIN / INVENTORY</span><h1>Gas inventory</h1><p>Manage current cylinder availability.</p></div></section><section class="section"><div class="container table-card"><div class="table-scroll"><table><thead><tr><th>Product</th><th>Size</th><th>Available</th><th>Status</th><th>Update</th></tr></thead><tbody>{% for gas in gases %}<tr><form method="POST" action="{{ url_for('update_inventory', gas_id=gas[0]) }}"><td><strong>{{ gas[1] }}</strong><small>{{ gas[2] }}</small></td><td>{{ gas[3] }}</td><td><input class="mini-input" type="number" min="0" name="available_quantity" value="{{ gas[4] }}"></td><td><select name="status"><option {% if gas[5]=='Available' %}selected{% endif %}>Available</option><option {% if gas[5]!='Available' %}selected{% endif %}>Unavailable</option></select></td><td><button class="btn btn-small btn-primary" type="submit">Save</button></td></form></tr>{% endfor %}</tbody></table></div></div></section>{% endblock %}
